<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    padding:14px 18px;
    background:#181818;
    border-bottom:1px solid #333;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:19px;
    font-weight:bold;
}

.online{
    color:#4caf50;
    font-size:13px;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
}

.message{
    margin-bottom:12px;
    max-width:600px;
}

.username{
    color:#888;
    font-size:12px;
    margin-bottom:3px;
}

.user-id{
    color:#555;
    font-size:10px;
    margin-left:5px;
}

.bubble{
    display:inline-block;
    background:#252525;
    padding:10px 13px;
    border-radius:10px;
    word-break:break-word;
}

.my-message{
    text-align:right;
    margin-left:auto;
}

.my-message .bubble{
    background:#2563eb;
}

.system{
    text-align:center;
    color:#666;
    font-size:12px;
    margin:12px;
}

.input-area{
    padding:10px;
    background:#181818;
    display:flex;
    gap:8px;
    border-top:1px solid #333;
}

#messageInput{
    flex:1;
    padding:12px;
    border:1px solid #333;
    border-radius:8px;
    background:#111;
    color:#fff;
    outline:none;
}

#sendButton{
    border:0;
    background:#2563eb;
    color:white;
    padding:0 18px;
    border-radius:8px;
    cursor:pointer;
}

#sendButton:hover{
    background:#1d4ed8;
}

#login{
    position:fixed;
    inset:0;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
}

.login-box{
    width:320px;
    padding:25px;
    background:#181818;
    border:1px solid #333;
    border-radius:12px;
}

.login-box h1{
    margin-top:0;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#111;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    outline:none;
}

.login-box button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

#loginStatus{
    color:#f85149;
    font-size:12px;
    margin-top:8px;
}
</style>

</head>

<body>

<div id="login">
    <div class="login-box">
        <h1>Global Chat</h1>

```
    <input
        id="usernameInput"
        maxlength="20"
        placeholder="Ваше имя"
    >

    <button onclick="joinChat()">Войти</button>

    <div id="loginStatus"></div>
</div>
```

</div>

<div class="app">

```
<div class="header">
    <div class="logo">Global Chat</div>
    <div class="online" id="connectionStatus">
        ● Подключение...
    </div>
</div>

<div id="messages"></div>

<form class="input-area" onsubmit="sendMessage(event)">
    <input
        id="messageInput"
        maxlength="500"
        autocomplete="off"
        placeholder="Сообщение..."
    >

    <button id="sendButton">➤</button>
</form>
```

</div>

<script>

const CLUSTER_ID = "free.blr2";
const API_KEY = "z6wytuVGQjVrMXNRFhqw7OmWppXB0kwq2amiuCmF";
const ROOM_ID = "global-chat";

let socket = null;
let username = "";
let userId = "";

const savedName = localStorage.getItem("globalChatUsername");
const savedId = localStorage.getItem("globalChatUserId");

if(savedName && savedId){

    username = savedName;
    userId = savedId;

    document.getElementById("usernameInput").value = username;
    document.getElementById("usernameInput").disabled = true;

    document.getElementById("login").style.display = "none";

    loadHistory();
    connect();
}

function createUserId(){

    return "user_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).substring(2,10);

}

function joinChat(){

    const input =
        document.getElementById("usernameInput");

    const name =
        input.value.trim();

    if(!name){

        document.getElementById("loginStatus").textContent =
            "Введите имя";

        return;
    }

    username = name;

    userId = createUserId();

    localStorage.setItem(
        "globalChatUsername",
        username
    );

    localStorage.setItem(
        "globalChatUserId",
        userId
    );

    input.disabled = true;

    document.getElementById("login").style.display =
        "none";

    loadHistory();
    connect();
}

function connect(){

    const url =
        `wss://${CLUSTER_ID}.piesocket.com/v3/${ROOM_ID}?api_key=${API_KEY}&notify_self=1`;

    socket = new WebSocket(url);

    socket.onopen = function(){

        document.getElementById(
            "connectionStatus"
        ).textContent = "● Онлайн";

        document.getElementById(
            "connectionStatus"
        ).style.color = "#4caf50";

        addSystemMessage(
            "Вы подключились"
        );
    };

    socket.onmessage = function(event){

        try{

            const data =
                JSON.parse(event.data);

            if(data.event === "new_message"){

                showMessage(
                    data.sender,
                    data.text,
                    data.userId
                );

                saveMessage(
                    data.sender,
                    data.text,
                    data.userId
                );
            }

            if(data.event === "new_joining"){

                addSystemMessage(
                    data.sender + " вошёл"
                );
            }

        }catch(e){}

    };

    socket.onclose = function(){

        document.getElementById(
            "connectionStatus"
        ).textContent = "● Оффлайн";

        document.getElementById(
            "connectionStatus"
        ).style.color = "#f85149";

        setTimeout(connect,3000);
    };

}

function sendMessage(event){

    event.preventDefault();

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text)
        return;

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){
        return;
    }

    socket.send(
        JSON.stringify({

            event:"new_message",

            sender:username,

            userId:userId,

            text:text

        })
    );

    input.value = "";
    input.focus();

}

function showMessage(sender,text,id){

    const container =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className = "message";

    if(id === userId){

        message.classList.add(
            "my-message"
        );

    }

    const name =
        document.createElement("div");

    name.className = "username";

    name.textContent = sender;

    const idElement =
        document.createElement("span");

    idElement.className = "user-id";

    idElement.textContent =
        "#" + id;

    name.appendChild(idElement);

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(name);
    message.appendChild(bubble);

    container.appendChild(message);

    container.scrollTop =
        container.scrollHeight;
}

function addSystemMessage(text){

    const message =
        document.createElement("div");

    message.className = "system";

    message.textContent = text;

    document.getElementById(
        "messages"
    ).appendChild(message);

}

function saveMessage(sender,text,id){

    let history =
        JSON.parse(
            localStorage.getItem(
                "globalChatHistory"
            ) || "[]"
        );

    const exists =
        history.some(function(message){

            return (
                message.sender === sender &&
                message.text === text &&
                message.userId === id
            );

        });

    if(!exists){

        history.push({

            sender:sender,

            text:text,

            userId:id,

            time:Date.now()

        });

    }

    if(history.length > 1000){

        history =
            history.slice(-1000);

    }

    localStorage.setItem(
        "globalChatHistory",
        JSON.stringify(history)
    );

}

function loadHistory(){

    const history =
        JSON.parse(
            localStorage.getItem(
                "globalChatHistory"
            ) || "[]"
        );

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    history.forEach(function(message){

        showMessage(
            message.sender,
            message.text,
            message.userId
        );

    });

    container.scrollTop =
        container.scrollHeight;

}

</script>

</body>
</html>

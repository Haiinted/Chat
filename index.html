<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Chat</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:55px;
    padding:0 18px;
    background:#181818;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:19px;
    font-weight:bold;
}

.status{
    font-size:13px;
    color:#4caf50;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
}

.message{
    margin-bottom:13px;
    max-width:650px;
}

.message.mine{
    margin-left:auto;
    text-align:right;
}

.username{
    color:#888;
    font-size:12px;
    margin-bottom:4px;
}

.uid{
    color:#555;
    font-size:10px;
}

.bubble{
    display:inline-block;
    padding:10px 13px;
    background:#252525;
    border-radius:10px;
    max-width:80%;
    text-align:left;
    word-break:break-word;
}

.mine .bubble{
    background:#2563eb;
}

.input{
    display:flex;
    gap:8px;
    padding:10px;
    background:#181818;
    border-top:1px solid #333;
}

#message{
    flex:1;
    background:#111;
    border:1px solid #333;
    color:white;
    padding:12px;
    border-radius:8px;
    outline:none;
}

button{
    border:0;
    background:#2563eb;
    color:white;
    border-radius:8px;
    padding:0 18px;
    cursor:pointer;
}

#login{
    position:fixed;
    inset:0;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
}

.login{
    width:320px;
    padding:25px;
    background:#181818;
    border:1px solid #333;
    border-radius:12px;
}

.login h1{
    margin-top:0;
}

.login input{
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#111;
    border:1px solid #333;
    color:white;
    border-radius:8px;
    outline:none;
}

.login button{
    width:100%;
    height:42px;
}

#error{
    color:#f85149;
    font-size:13px;
    margin-top:10px;
}
</style>
</head>

<body>

<div id="login">
    <div class="login">
        <h1>Global Chat</h1>

        <input
            id="username"
            maxlength="20"
            placeholder="Ваше имя"
        >

        <button onclick="register()">
            Войти
        </button>

        <div id="error"></div>
    </div>
</div>

<div class="app">

    <div class="header">
        <div class="logo">
            Global Chat
        </div>

        <div class="status" id="status">
            ● Подключение
        </div>
    </div>

    <div id="messages"></div>

    <form class="input" onsubmit="send(event)">
        <input
            id="message"
            maxlength="500"
            autocomplete="off"
            placeholder="Сообщение..."
        >

        <button>
            ➤
        </button>
    </form>

</div>

<script>

let user = null;
let socket = null;

const savedToken =
    localStorage.getItem("chatToken");

async function register(){

    const input =
        document.getElementById("username");

    const name =
        input.value.trim();

    if(!name){
        showError("Введите имя");
        return;
    }

    const response =
        await fetch("/register",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username:name
            })
        });

    const data =
        await response.json();

    if(data.error){
        showError(data.error);
        return;
    }

    localStorage.setItem(
        "chatToken",
        data.token
    );

    localStorage.setItem(
        "chatUsername",
        data.username
    );

    localStorage.setItem(
        "chatUserId",
        data.id
    );

    user = data;

    document.getElementById(
        "login"
    ).style.display="none";

    loadChat();
}

async function login(){

    const token =
        localStorage.getItem("chatToken");

    const username =
        localStorage.getItem("chatUsername");

    const id =
        localStorage.getItem("chatUserId");

    if(!token || !username || !id){
        return false;
    }

    user = {
        token:token,
        username:username,
        id:id
    };

    document.getElementById(
        "login"
    ).style.display="none";

    loadChat();

    return true;
}

async function loadChat(){

    const response =
        await fetch("/history");

    const history =
        await response.json();

    const container =
        document.getElementById("messages");

    container.innerHTML="";

    history.forEach(message=>{
        showMessage(
            message.sender,
            message.text,
            message.userId
        );
    });

    container.scrollTop =
        container.scrollHeight;

    connect();
}

function connect(){

    const protocol =
        location.protocol==="https:"
        ? "wss"
        : "ws";

    socket =
        new WebSocket(
            `${protocol}://${location.host}/ws?token=${user.token}`
        );

    socket.onopen=()=>{

        document.getElementById(
            "status"
        ).textContent="● Онлайн";

    };

    socket.onmessage=(event)=>{

        const data =
            JSON.parse(event.data);

        if(data.type==="message"){

            showMessage(
                data.sender,
                data.text,
                data.userId
            );

        }

    };

    socket.onclose=()=>{

        document.getElementById(
            "status"
        ).textContent="● Оффлайн";

        setTimeout(connect,3000);

    };

}

function send(event){

    event.preventDefault();

    const input =
        document.getElementById("message");

    const text =
        input.value.trim();

    if(!text)
        return;

    if(
        !socket ||
        socket.readyState!==WebSocket.OPEN
    )
        return;

    socket.send(
        JSON.stringify({
            type:"message",
            text:text
        })
    );

    input.value="";
    input.focus();

}

function showMessage(
    sender,
    text,
    id
){

    const container =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className="message";

    if(
        user &&
        id===user.id
    ){
        message.classList.add("mine");
    }

    const name =
        document.createElement("div");

    name.className="username";

    name.textContent=sender+" ";

    const uid =
        document.createElement("span");

    uid.className="uid";

    uid.textContent="#"+id;

    name.appendChild(uid);

    const bubble =
        document.createElement("div");

    bubble.className="bubble";

    bubble.textContent=text;

    message.appendChild(name);
    message.appendChild(bubble);

    container.appendChild(message);

    container.scrollTop =
        container.scrollHeight;

}

function showError(text){

    document.getElementById(
        "error"
    ).textContent=text;

}

if(savedToken){

    login();

}

</script>

</body>
</html>

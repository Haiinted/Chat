<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 65px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            padding: 0 25px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .online {
            margin-left: 15px;
            color: #3fb950;
            font-size: 14px;
        }

        /* CHAT */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            margin-bottom: 15px;
            max-width: 700px;
        }

        .username {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .bubble {
            display: inline-block;
            background: #21262d;
            padding: 11px 15px;
            border-radius: 12px;
            word-break: break-word;
        }

        .my-message {
            text-align: right;
            margin-left: auto;
        }

        .my-message .bubble {
            background: #238636;
        }

        .system {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            margin: 15px;
        }

        /* INPUT */

        .input-area {
            padding: 15px;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            padding: 14px;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #58a6ff;
        }

        #sendButton {
            background: #238636;
            border: none;
            color: white;
            padding: 0 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        #sendButton:hover {
            background: #2ea043;
        }

        /* LOGIN */

        #login {
            position: fixed;
            inset: 0;
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .login-box {
            width: 350px;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 30px;
            border-radius: 15px;
        }

        .login-box h1 {
            margin-top: 0;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 8px;
            outline: none;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            background: #238636;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .status {
            font-size: 13px;
            color: #8b949e;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

    <div class="login-box">

        <h1>🌎 Global Chat</h1>

        <p>Введите своё имя</p>

        <input
            id="usernameInput"
            type="text"
            maxlength="20"
            placeholder="Например: Haiinted"
        >

        <button onclick="joinChat()">
            Войти в чат
        </button>

        <div class="status" id="loginStatus"></div>

    </div>

</div>


<!-- CHAT -->

<div class="app">

    <div class="header">

        <div class="logo">
            🌎 Global Chat
        </div>

        <div class="online" id="connectionStatus">
            ● Подключение...
        </div>

    </div>


    <div id="messages"></div>


    <form class="input-area" onsubmit="sendMessage(event)">

        <input
            id="messageInput"
            type="text"
            maxlength="500"
            autocomplete="off"
            placeholder="Написать сообщение..."
        >

        <button id="sendButton">
            Отправить
        </button>

    </form>

</div>


<script>

    /*
        ============================
        PIE SOCKET CONFIG
        ============================
    */

    const CLUSTER_ID = "free.blr2";

    const API_KEY = "z6wytuVGQjVrMXNRFhqw7OmWppXB0kwq2amiuCmF";

    // Одна комната для всех пользователей
    const ROOM_ID = "global-chat";


    /*
        ============================
        VARIABLES
        ============================
    */

    let socket = null;

    let username = "";



    /*
        ============================
        LOGIN
        ============================
    */

    function joinChat() {

        const input =
            document.getElementById("usernameInput");

        username = input.value.trim();

        if (!username) {

            document.getElementById("loginStatus").textContent =
                "Введите имя";

            return;
        }

        // Сохраняем имя
        localStorage.setItem(
            "globalChatUsername",
            username
        );

        // Убираем окно входа
        document.getElementById("login").style.display =
            "none";

        connect();
    }



    /*
        ============================
        CONNECT TO PIESOCKET
        ============================
    */

    function connect() {

        const url =
            `wss://${CLUSTER_ID}.piesocket.com/v3/${ROOM_ID}?api_key=${API_KEY}&notify_self=1`;

        socket = new WebSocket(url);


        /*
            CONNECTED
        */

        socket.onopen = function() {

            document.getElementById(
                "connectionStatus"
            ).textContent = "● Онлайн";

            document.getElementById(
                "connectionStatus"
            ).style.color = "#3fb950";

            addSystemMessage(
                "Вы подключились к глобальному чату"
            );
        };


        /*
            MESSAGE RECEIVED
        */

        socket.onmessage = function(event) {

            try {

                const data =
                    JSON.parse(event.data);

                console.log(
                    "Получено:",
                    data
                );


                /*
                    PieSocket может вернуть
                    служебные сообщения.
                */

                if (
                    data.event === "new_message"
                ) {

                    showMessage(
                        data.sender,
                        data.text
                    );

                }

                else if (
                    data.event === "new_joining"
                ) {

                    addSystemMessage(
                        data.sender +
                        " вошёл в чат"
                    );

                }

            }

            catch (error) {

                console.log(
                    "Не удалось обработать сообщение:",
                    event.data
                );

            }

        };


        /*
            DISCONNECTED
        */

        socket.onclose = function() {

            document.getElementById(
                "connectionStatus"
            ).textContent = "● Отключено";

            document.getElementById(
                "connectionStatus"
            ).style.color = "#f85149";

            addSystemMessage(
                "Соединение потеряно. Переподключение..."
            );

            setTimeout(connect, 3000);
        };


        /*
            ERROR
        */

        socket.onerror = function(error) {

            console.log(
                "WebSocket error:",
                error
            );

        };

    }



    /*
        ============================
        SEND MESSAGE
        ============================
    */

    function sendMessage(event) {

        event.preventDefault();

        const input =
            document.getElementById(
                "messageInput"
            );

        const text =
            input.value.trim();


        if (!text)
            return;


        if (
            !socket ||
            socket.readyState !== WebSocket.OPEN
        ) {

            alert(
                "Нет соединения с сервером"
            );

            return;
        }


        /*
            Отправляем JSON
        */

        socket.send(
            JSON.stringify({

                event: "new_message",

                sender: username,

                text: text

            })
        );


        input.value = "";

        input.focus();

    }



    /*
        ============================
        SHOW MESSAGE
        ============================
    */

    function showMessage(sender, text) {

        const container =
            document.getElementById(
                "messages"
            );


        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message";


        if (sender === username) {

            message.classList.add(
                "my-message"
            );

        }


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "username";

        name.textContent =
            sender;


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";

        // textContent защищает от HTML/JS-инъекций
        bubble.textContent =
            text;


        message.appendChild(name);

        message.appendChild(bubble);

        container.appendChild(message);


        // Прокрутка вниз
        container.scrollTop =
            container.scrollHeight;

    }



    /*
        ============================
        SYSTEM MESSAGE
        ============================
    */

    function addSystemMessage(text) {

        const container =
            document.getElementById(
                "messages"
            );


        const message =
            document.createElement(
                "div"
            );

        message.className =
            "system";

        message.textContent =
            text;


        container.appendChild(
            message
        );


        container.scrollTop =
            container.scrollHeight;

    }



    /*
        ============================
        LOAD SAVED USERNAME
        ============================
    */

    const savedUsername =
        localStorage.getItem(
            "globalChatUsername"
        );


    if (savedUsername) {

        document.getElementById(
            "usernameInput"
        ).value =
            savedUsername;

    }

</script>

</body>
</html>

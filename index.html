<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    padding:15px 20px;
    background:#181818;
    border-bottom:1px solid #333;
    display:flex;
    justify-content:space-between;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.online{
    color:#4caf50;
    font-size:14px;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:12px;
    max-width:600px;
}

.username{
    color:#888;
    font-size:12px;
    margin-bottom:3px;
}

.bubble{
    display:inline-block;
    background:#252525;
    padding:10px 13px;
    border-radius:10px;
    word-break:break-word;
}

.my-message{
    text-align:right;
    margin-left:auto;
}

.my-message .bubble{
    background:#2563eb;
}

.system{
    text-align:center;
    color:#777;
    font-size:12px;
    margin:10px;
}

.input-area{
    padding:12px;
    background:#181818;
    display:flex;
    gap:8px;
}

#messageInput{
    flex:1;
    padding:12px;
    border:1px solid #333;
    border-radius:8px;
    background:#111;
    color:#fff;
    outline:none;
}

#sendButton{
    border:0;
    background:#2563eb;
    color:white;
    padding:0 18px;
    border-radius:8px;
    cursor:pointer;
}

#login{
    position:fixed;
    inset:0;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
}

.login-box{
    width:320px;
    padding:25px;
    background:#181818;
    border:1px solid #333;
    border-radius:12px;
}

.login-box h1{
    margin-top:0;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#111;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    outline:none;
}

.login-box button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}
</style>

</head>

<body>

<div id="login">
    <div class="login-box">
        <h1>Global Chat</h1>
        <input id="usernameInput" maxlength="20" placeholder="Ваше имя">
        <button onclick="joinChat()">Войти</button>
        <div id="loginStatus"></div>
    </div>
</div>

<div class="app">

```
<div class="header">
    <div class="logo">Global Chat</div>
    <div class="online" id="connectionStatus">● Подключение...</div>
</div>

<div id="messages"></div>

<form class="input-area" onsubmit="sendMessage(event)">
    <input id="messageInput" maxlength="500" autocomplete="off" placeholder="Сообщение...">
    <button id="sendButton">➤</button>
</form>
```

</div>

<script>
const CLUSTER_ID="free.blr2";
const API_KEY="z6wytuVGQjVrMXNRFhqw7OmWppXB0kwq2amiuCmF";
const ROOM_ID="global-chat";

let socket=null;
let username="";

function joinChat(){
    username=document.getElementById("usernameInput").value.trim();

    if(!username){
        document.getElementById("loginStatus").textContent="Введите имя";
        return;
    }

    localStorage.setItem("globalChatUsername",username);
    document.getElementById("login").style.display="none";
    connect();
}

function connect(){
    const url=`wss://${CLUSTER_ID}.piesocket.com/v3/${ROOM_ID}?api_key=${API_KEY}&notify_self=1`;

    socket=new WebSocket(url);

    socket.onopen=()=>{
        document.getElementById("connectionStatus").textContent="● Онлайн";
        addSystemMessage("Вы вошли в чат");
    };

    socket.onmessage=(event)=>{
        try{
            const data=JSON.parse(event.data);

            if(data.event==="new_message"){
                showMessage(data.sender,data.text);
            }

            if(data.event==="new_joining"){
                addSystemMessage(data.sender+" вошёл");
            }
        }catch(e){}
    };

    socket.onclose=()=>{
        document.getElementById("connectionStatus").textContent="● Оффлайн";
        setTimeout(connect,3000);
    };
}

function sendMessage(event){
    event.preventDefault();

    const input=document.getElementById("messageInput");
    const text=input.value.trim();

    if(!text)return;

    if(!socket || socket.readyState!==WebSocket.OPEN){
        return;
    }

    socket.send(JSON.stringify({
        event:"new_message",
        sender:username,
        text:text
    }));

    input.value="";
    input.focus();
}

function showMessage(sender,text){
    const container=document.getElementById("messages");

    const message=document.createElement("div");
    message.className="message";

    if(sender===username){
        message.classList.add("my-message");
    }

    const name=document.createElement("div");
    name.className="username";
    name.textContent=sender;

    const bubble=document.createElement("div");
    bubble.className="bubble";
    bubble.textContent=text;

    message.appendChild(name);
    message.appendChild(bubble);
    container.appendChild(message);

    container.scrollTop=container.scrollHeight;
}

function addSystemMessage(text){
    const message=document.createElement("div");
    message.className="system";
    message.textContent=text;

    document.getElementById("messages").appendChild(message);
}

const savedUsername=localStorage.getItem("globalChatUsername");

if(savedUsername){
    document.getElementById("usernameInput").value=savedUsername;
}
</script>

</body>
</html>
